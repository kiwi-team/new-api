
另外可以在 Nginx access log 里加上 $request_time（Nginx 从收到客户端第一个字节到发完最后一个字节的总时间）和 $upstream_response_time（上游响应时间），对比一下就能确认差异来源：

log_format timing '$remote_addr - $request_time $upstream_response_time';
如果 $upstream_response_time ≈ 30s 但 $request_time ≈ 60s，那就坐实了是 Nginx 层面的缓冲/传输造成的差异。

location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Start $msec;

    # ===== WebSocket 支持 =====
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # ===== 关键修改：关闭响应缓冲，边收边发 =====
    proxy_buffering off;
    
    # 请求体不缓冲（大图片上传）
    proxy_request_buffering off;
    

    # TCP 优化
    tcp_nodelay on;
    tcp_nopush off;

    # 超时
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 3600s;
    
    # 大 body 支持
    client_max_body_size 100m;
    client_body_buffer_size 10m;
}
