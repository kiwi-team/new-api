bind 0.0.0.0
port 6379
protected-mode yes
daemonize no
logfile ""
loglevel notice

# The Compose command supplies requirepass from REDIS_PASSWORD.
dir /data
dbfilename dump.rdb
appendonly yes
appendfsync everysec
aof-use-rdb-preamble yes
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes

# Preserve accounting/session keys; return write errors instead of evicting them.
maxmemory 512mb
maxmemory-policy noeviction
timeout 0
tcp-keepalive 300
databases 16
