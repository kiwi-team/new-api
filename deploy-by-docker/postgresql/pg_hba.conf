# Unix sockets are available only inside the PostgreSQL container for initialization/admin.
local   all   all                         trust

# The container has no published database port; TCP always requires SCRAM authentication.
host    all   all   127.0.0.1/32          scram-sha-256
host    all   all   ::1/128               scram-sha-256
host    all   all   0.0.0.0/0             scram-sha-256
host    all   all   ::/0                  scram-sha-256
